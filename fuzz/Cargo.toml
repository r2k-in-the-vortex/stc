[package]
name = "stc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Fuzz targets use a separate workspace and the nightly toolchain.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
stc-codegen = { path = "../crates/stc-codegen" }
stc-diag = { path = "../crates/stc-diag" }
stc-got = { path = "../crates/stc-got" }
stc-lexer = { path = "../crates/stc-lexer" }
stc-manifest = { path = "../crates/stc-manifest" }
stc-parser = { path = "../crates/stc-parser" }
stc-runtime = { path = "../crates/stc-runtime" }
stc-sema = { path = "../crates/stc-sema" }
stc-span = { path = "../crates/stc-span" }

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_codegen"
path = "fuzz_targets/fuzz_codegen.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_analyzer"
path = "fuzz_targets/fuzz_analyzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_got_manifest"
path = "fuzz_targets/fuzz_got_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_module_descriptor"
path = "fuzz_targets/fuzz_module_descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_manifest"
path = "fuzz_targets/fuzz_manifest.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true
