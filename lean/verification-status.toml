# Phase 0 verification registry (Plan-Phase0.md §7).
#
# This checked-in table is the single source of truth for the Phase 0 theorem
# inventory and its proof status. The full registry tooling and generated
# status matrix are Phase 1 work; `tools/ci/check_verification_registry.py`
# validates this table, resolves proved entries against the Lean environment,
# and audits their axioms. Later phases extend the table; they do not rename
# or silently redefine an existing entry.
#
# Fields:
#   id       stable registry key
#   kind     theorem | evidence | definition
#   name     fully qualified Lean name (or artifact name for evidence)
#   phase    P0.0 through P0.7
#   level    claim ladder: S, V0..V4
#   spec     repository path plus a section anchor
#   module   Lean module that holds the declaration
#   owner    accountable verification owner
#   status   planned | proved | tested | descoped
#   tcb      trust-boundary note
#   note     optional free text; required when status is "descoped"

schema_version = 1
profile = "stc-2013-oop-utf8-v1"
semantics_version = "1.0-draft"
dump_format_version = "0.1-draft"

