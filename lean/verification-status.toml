# Verification registry (Semantics.md §7).
#
# This checked-in table is the single source of truth for the theorem inventory
# and its proof status. The full registry tooling and generated status matrix
# are Phase 1 work; `tools/ci/check_verification_registry.py` validates this
# table, resolves proved entries against the Lean environment, audits their
# axioms, and resolves module paths in both the default `lean/` package and the
# separate `lean/aeneas/` bridge package. Later phases extend the table; they
# do not rename or silently redefine an existing entry.
#
# Fields:
#   id       stable registry key
#   kind     theorem | evidence | definition
#   name     fully qualified Lean name (or artifact name for evidence)
#   phase    P0.0 through P0.7; P1 for Phase 1 bridge evidence
#   level    claim ladder: S, V0..V4
#   spec     repository path plus a section anchor
#   module   Lean module that holds the declaration (default or bridge package)
#   owner    accountable verification owner
#   status   planned | proved | tested | descoped
#   tcb      trust-boundary note
#   note     optional free text; required when status is "descoped"
#
# Phase 1 records (P1-*) are V0 evidence with status "tested" or "planned";
# the checker rejects a proved or higher-level Phase 1 record. No Phase 1
# record claims refinement, and the Phase 0 S-level semantics remains the only
# reviewed claim. The durable Phase 1 summary is
# specification/Verification/Reports/Phase1-Report.md.

schema_version = 1
profile = "stc-2013-oop-utf8-v1"
semantics_version = "1.0"
dump_format_version = "0.1.0"
# The commit that froze semantics_version 1.0 (P0.7). A commit cannot name
# itself, so the freeze commit is committed with a marked placeholder and the
# placeholder is replaced by the exact hash in the immediately following
# commit. Phase0-Report.md records the same value.
semantics_freeze_commit = "7aad70d41e1dc4b47606f13cd7818b638fd45927"

