[workspace]
resolver = "3"
members = [
    "crates/stc-span",
    "crates/stc-diag",
    "crates/stc-lexer",
    "crates/stc-syntax",
    "crates/stc-parser",
    "crates/stc-hir",
    "crates/stc-sema",
    "crates/stc-codegen",
    "crates/stc-got",
    "crates/stc-manifest",
    "crates/stc-runtime",
    "crates/stc-test",
    "crates/stc-fmt",
    "crates/stc-driver",
    "crates/xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
