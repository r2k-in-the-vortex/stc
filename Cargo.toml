[workspace]
resolver = "3"
members = [
    "crates/stc-span",
    "crates/stc-diag",
    "crates/stc-lexer",
    "crates/stc-syntax",
    "crates/stc-parser",
    "crates/stc-hir",
    "crates/stc-sema",
    "crates/stc-codegen",
    "crates/stc-got",
    "crates/stc-manifest",
    "crates/stc-runtime",
    "crates/stc-test",
    "crates/stc-fmt",
    "crates/stc-ide",
    "crates/stc-lsp",
    "crates/stc-driver",
    "crates/xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Release artifacts are shipped; reduce debug information at build time, and
# the driver/package archive steps remove the remaining standard-library debug
# sections (D-191).
[profile.release]
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
