schema = 1

[package]
name = "diewu-hil"
version = "0.1.0"
language = "stc-2013-oop-utf8-v1"

[project]
sources = ["src/**/*.st"]
configuration = "DiewuHil"

[build]
emit = ["module", "metadata"]

[run]
cycles = 0
cycle-time = "1ms"

[retain]
enabled = false

[io]
backend = "ethercat"
config = "io/bench.toml"

[[io.devices]]
name = "diewu"
kind = "ethercat"

  [[io.devices.channels]]
  name = "IN0"
  direction = "input"
  width = 1

  [[io.devices.channels]]
  name = "IN1"
  direction = "input"
  width = 1

