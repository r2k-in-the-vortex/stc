  [[io.devices.channels]]
  name = "slave0.operational"
  direction = "input"
  width = 1

# Direct process-image bindings for the DIEWU channels. OUT14 and OUT15 are
# deliberately routed instead: OUT14 is driven by PLC output Out0 and OUT15 is
# an open-ended input-to-output pass-through.
