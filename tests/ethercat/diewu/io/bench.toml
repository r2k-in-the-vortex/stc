bit = 2

[[device.diewu.pdo-channels]]
name = "OUT11"
entry = { index = "0x3101", subindex = 2 }
bit = 3

[[device.diewu.pdo-channels]]
name = "OUT12"
entry = { index = "0x3101", subindex = 2 }
bit = 4

[[device.diewu.pdo-channels]]
name = "OUT13"
entry = { index = "0x3101", subindex = 2 }
bit = 5

[[device.diewu.pdo-channels]]
name = "OUT14"
entry = { index = "0x3101", subindex = 2 }
bit = 6

[[device.diewu.pdo-channels]]
name = "OUT15"
entry = { index = "0x3101", subindex = 2 }
bit = 7

# Routes for the open-ended run:
#  - IN15 passes through to OUT15 without involving the PLC program;
#  - the PLC output Out0 drives OUT14 (PLC output -> physical output);
#  - the PLC output Out1 drives Shadow1 through the buffered PLC -> PLC path
#    (one-scan delay).
[[routes]]
source = { kind = "physical-input", device = "diewu", channel = "IN15" }
sinks = [{ kind = "physical-output", device = "diewu", channel = "OUT15" }]

[[routes]]
source = { kind = "plc-output", variable = "Out0" }
sinks = [{ kind = "physical-output", device = "diewu", channel = "OUT14" }]

[[routes]]
source = { kind = "plc-output", variable = "Out1" }
sinks = [{ kind = "plc-input", variable = "Shadow1" }]
