schema = 1

[package]
name = "mixed-bench"
version = "0.1.0"
language = "stc-2013-oop-utf8-v1"

[project]
sources = ["src/**/*.st"]
configuration = "MixedBench"

[build]
emit = ["module", "metadata"]

[run]
# 0 runs until interrupted; the bench script and manual procedure override it.
cycles = 0
cycle-time = "1ms"

[retain]
enabled = false

[io]
# One coordinator owns both hardware backends; each device `kind` selects its
# backend. There is no global Modbus spelling. The bench script passes
# `--io ethercat` so unbound image areas keep the established global default.
config = "io/bench.toml"

# ---------------------------------------------------------------------------
# DIEWU EtherCAT-IO 16I/16O at position 0 (see tests/ethercat/diewu).
# ---------------------------------------------------------------------------
[[io.devices]]
name = "diewu"
kind = "ethercat"

  [[io.devices.channels]]
  name = "IN0"
  direction = "input"
  width = 1

