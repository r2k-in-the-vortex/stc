# ---------------------------------------------------------------------------
# Modbus TCP server on the bench LAN. Zero-based addresses: HR 0/1 and coils
# 0/1. The network client writes BenchCmd/BenchBit and reads BenchSeen/BenchOut.
# ---------------------------------------------------------------------------
[[io.devices]]
name = "modbus0"
kind = "modbus-tcp"

  [[io.devices.channels]]
  name = "BenchCmd"
  direction = "input"
  width = 16

  [[io.devices.channels]]
  name = "BenchBit"
  direction = "input"
  width = 1

  [[io.devices.channels]]
  name = "BenchSeen"
  direction = "output"
  width = 16

  [[io.devices.channels]]
  name = "BenchOut"
  direction = "output"
  width = 1

[[io.devices]]
name = "MBStatus"
kind = "modbus-tcp-status"
config = { layout = 1 }

  [[io.devices.channels]]
  name = "server0.listening"
  direction = "input"
  width = 1

  [[io.devices.channels]]
  name = "server0.listeners"
  direction = "input"
  width = 16

  [[io.devices.channels]]
  name = "server0.bound_listeners"
  direction = "input"
  width = 16

  [[io.devices.channels]]
  name = "server0.connections"
  direction = "input"
  width = 16

  [[io.devices.channels]]
  name = "server0.requests"
  direction = "input"
  width = 32

  [[io.devices.channels]]
  name = "server0.writes"
  direction = "input"
  width = 32

  [[io.devices.channels]]
  name = "server0.exceptions"
  direction = "input"
  width = 32

  [[io.devices.channels]]
  name = "server0.malformed"
  direction = "input"
  width = 32

  [[io.devices.channels]]
  name = "server0.last_error"
  direction = "input"
  width = 32

