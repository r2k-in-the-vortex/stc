# No routes: every EtherCAT channel is directly bound, and the Modbus channels
# are not wired to EtherCAT. Cross-backend routing is covered by the mixed
# coordinator mock test in crates/stc-runtime/src/io_modbus_tcp.rs.

[device.modbus0]
bind = ["0.0.0.0:15030"]
unit = 1
max-connections = 8
idle-timeout = "60s"
word-order = "high-first"

# The network client writes command word 0 and coil 0; the PLC adds one and
# copies the bit, so the client reads the results at register 1 and coil 1.
[[device.modbus0.channels]]
name = "BenchCmd"
table = "holding-register"
address = 0

[[device.modbus0.channels]]
name = "BenchBit"
table = "coil"
address = 0

[[device.modbus0.channels]]
name = "BenchSeen"
table = "holding-register"
address = 1

[[device.modbus0.channels]]
name = "BenchOut"
table = "coil"
address = 1
