# Example-only Mosquitto configuration for the examples/mqtt walkthrough.
# Mosquitto is a test tool here, not a supported product surface and not a
# dependency of the stc package.
#
# Listener 1883 is the plain MQTT listener used by the runtime. Listener 9001
# is the WebSocket listener used by MQTTX Web and other browser clients; a
# browser cannot open a raw MQTT TCP connection.
per_listener_settings false
allow_anonymous true
log_dest stdout
log_type all
connection_messages true

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets
