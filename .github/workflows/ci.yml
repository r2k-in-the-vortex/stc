name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

# Runner images are pinned to named versions; `-latest` migrations must not
# silently change the matrix.
jobs:
  # The specification is written before the compiler. This job reports which
  # parts of the tree exist so the code-backed jobs can stay skipped until
  # their workspace, suite, or tool is added.
  ci:
    name: CI
    needs:
      - detect
      - docs
      - fmt
      - clippy
      - test
      - coverage
      - online
      - ui
      - conformance
      - execution
      - projects
      - debug
      - traceability
      - lean
      - fuzz-smoke
      - cross-target
      - package
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        shell: bash
        run: |
          set -euo pipefail
          failed="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$failed" = "true" ]; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed or were skipped."

  detect:
    name: Detect project state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.flags.outputs.rust }}
      lean: ${{ steps.flags.outputs.lean }}
      fuzz: ${{ steps.flags.outputs.fuzz }}
      xtask: ${{ steps.flags.outputs.xtask }}
      ui: ${{ steps.flags.outputs.ui }}
      conformance: ${{ steps.flags.outputs.conformance }}
      execution: ${{ steps.flags.outputs.execution }}
      projects: ${{ steps.flags.outputs.projects }}
      cross_target: ${{ steps.flags.outputs.cross_target }}
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
      - id: flags
        name: Detect workspace, suites, and tools
        shell: bash
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          if [ -f Cargo.toml ]; then emit rust true; else emit rust false; fi
          if [ -f lean/lakefile.lean ]; then emit lean true; else emit lean false; fi
          if [ -f fuzz/Cargo.toml ] && compgen -G "fuzz/fuzz_targets/*.rs" > /dev/null; then
            emit fuzz true
          else
            emit fuzz false
          fi
          if [ -d crates/xtask ] || [ -d tools/xtask ]; then emit xtask true; else emit xtask false; fi
          if [ -d tests/ui ]; then emit ui true; else emit ui false; fi
          if [ -d tests/conformance ]; then emit conformance true; else emit conformance false; fi
          # The execution suite is the driver integration test, not a corpus directory.
          if [ -f crates/stc-driver/tests/execution.rs ]; then
            emit execution true
          else
            emit execution false
          fi
          if [ -f crates/stc-driver/tests/projects.rs ]; then
            emit projects true
          else
            emit projects false
          fi
          if [ -f tests/cross-target/smoke.ll ]; then emit cross_target true; else emit cross_target false; fi

  docs:
    name: Docs and specification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
      - name: Check specification tree
        run: python3 tools/ci/check_docs.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.24.0

  fmt:
    name: Rust fmt
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Rust clippy
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust test (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --locked

  # Coverage runs the same workspace tests under LLVM instrumentation. The
  # per-file summary is written to the job summary and the lcov/HTML reports
  # are uploaded. On main, the generated badge is also pushed to the `badges`
  # branch that the README links to; only this job requests write access.
  coverage:
    name: Rust coverage
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          # `cargo llvm-cov clean` removes the instrumented target directory,
          # so only the registry cache is useful here.
          cache-targets: false
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Run workspace tests with coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path target/lcov.info
      - name: Write coverage summary
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov report --json --summary-only --output-path target/summary.json
          python3 tools/ci/coverage_summary.py target/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build HTML report
        run: cargo llvm-cov report --html
      - name: Build coverage badge
        run: |
          python3 tools/ci/coverage_badge.py target/lcov.info \
            --svg target/coverage.svg \
            --json target/coverage.json
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            target/lcov.info
            target/summary.json
            target/llvm-cov/html
          if-no-files-found: error
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          badge_dir="$RUNNER_TEMP/coverage-badge"
          mkdir -p "$badge_dir"
          cp target/coverage.svg target/coverage.json "$badge_dir/"
          cd "$badge_dir"
          git init -q
          git checkout -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg coverage.json
          git commit -q -m "Update coverage badge"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # The online-change suite gets an explicit job so a hot-swap or manifest
  # regression is visible even when the workspace job reports an unrelated
  # failure. It runs the GOT, descriptor/manifest projection, host lifecycle,
  # online-change CLI, and launcher/embedding suites on both hosts.
  online:
    name: Online change (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Run GOT identity and manifest tests
        run: cargo test -p stc-got --tests --locked
      - name: Run descriptor/manifest projection tests
        run: cargo test -p stc-codegen --test module_artifacts --locked
      - name: Run host lifecycle and image remap tests
        run: cargo test -p stc-runtime --tests --locked
      - name: Run online-change CLI tests
        run: cargo test -p stc-driver --test module_cli --locked
      - name: Run launcher and embedding-host artifact tests
        run: cargo test -p stc-driver --test execution --locked

  # Suite jobs use the planned automation entry point:
  #   cargo xtask test --suite <name> --locked
  # xtask forwards --locked to the cargo commands it runs. The jobs stay
  # skipped until both xtask and the suite directory exist.
  ui:
    name: UI diagnostics (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.xtask == 'true' && needs.detect.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Run UI diagnostic snapshots
        run: cargo xtask test --suite ui --locked

  conformance:
    name: Conformance corpus (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.xtask == 'true' && needs.detect.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Run conformance corpus
        run: cargo xtask test --suite conformance --locked

  execution:
    name: Execution tests (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.xtask == 'true' && needs.detect.outputs.execution == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Run execution tests
        run: cargo xtask test --suite execution --locked

  projects:
    name: Projects (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.xtask == 'true' && needs.detect.outputs.projects == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Run the end-to-end project workflow
        run: cargo xtask test --suite projects --locked

  # The debug suites get an explicit per-host job so a platform-specific
  # regression in debug information, checkpoint hooks, stop/step/stack, the
  # protocol, or the CLI is visible even when the workspace job reports an
  # unrelated failure. `cargo xtask test --suite debug` runs the same targets
  # locally: typed access/write/watch, stop/step/stack, protocol/auth/audit,
  # CLI launch/attach/swap, release hook absence, frame sidecars, and
  # checkpoint and debug-info generation. Linux x64 and AArch64 both run the
  # native DWARF frame path.
  debug:
    name: Debug suites (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      # The suites must not silently skip their object-content assertions.
      # Windows needs llvm-readobj for CodeView; Linux needs readelf because
      # the DWARF line-table check is guarded on it even under
      # STC_REQUIRE_CLANG.
      - name: Require the platform debug inspection tools
        shell: bash
        run: |
          set -euo pipefail
          clang --version | head -n 1
          if [ "$RUNNER_OS" = "Windows" ]; then
            command -v llvm-readobj >/dev/null || {
              echo "::error::llvm-readobj is required for the CodeView assertions"
              exit 1
            }
            llvm-readobj --version | head -n 1
          else
            command -v readelf >/dev/null || {
              echo "::error::readelf is required for the DWARF line-table assertions"
              exit 1
            }
            readelf --version | head -n 1
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Run the debug matrix
        run: cargo xtask test --suite debug --locked
      # Manual dispatches also record the debug overhead numbers on both hosts.
      # The test is ignored on push/PR runs, so CI never pays for the timing and
      # never gates on it; only the artifact preconditions are assertions.
      - name: Measure debug overhead (informational)
        if: github.event_name == 'workflow_dispatch'
        run: >-
          cargo test -p stc-driver --test debug_overhead --locked --
          --ignored --nocapture

  traceability:
    name: Rule traceability
    needs: detect
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.xtask == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Check that every implemented rule has test evidence
        run: cargo run --locked -p xtask -- traceability --check
      - name: Check that host-specific code stays in the platform layer
        run: cargo run --locked -p xtask -- host-audit --check

  lean:
    name: Lean proofs
    needs: detect
    if: needs.detect.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          test: false
          lint: false
      - name: Reject sorry/admit in exact modules
        working-directory: lean
        shell: bash
        run: |
          if [ ! -d Stc/Exact ]; then
            echo "::error::Stc/Exact is missing"
            exit 1
          fi
          if grep -rnwE 'sorry|admit' Stc/Exact; then
            echo "::error::sorry/admit found in Stc/Exact"
            exit 1
          fi
      - name: Reject sorry/admit in Phase 0 modules
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            Stc/Syntax
            Stc/Grammar
            Stc/Hir
            Stc/Sem
            Stc/Codegen
            Verification
          )
          for path in "${paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Phase 0 module path $path is missing"
              exit 1
            fi
            if grep -rnwE 'sorry|admit' "$path"; then
              echo "::error::sorry/admit found in $path"
              exit 1
            fi
          done
      - name: Check the Phase 0 verification registry and axioms
        run: python3 tools/ci/check_verification_registry.py
      - name: Check the fail-closed semantics-conformance placeholder
        run: python3 tools/ci/check_semantics_placeholder.py
      - name: Regenerate exact-function vectors and check they are committed
        if: hashFiles('lean/VectorCli.lean') != ''
        working-directory: lean
        shell: bash
        run: |
          lake exe vectors
          if [ -n "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all -- tests/vectors)" ]; then
            git -C "$GITHUB_WORKSPACE" status --short -- tests/vectors
            echo "::error::generated vectors are not committed"
            exit 1
          fi

  fuzz-smoke:
    name: Fuzz smoke
    needs: detect
    if: needs.detect.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      # fuzz/ is a separate workspace, so the clippy and test jobs never
      # compile it. Build every target up front: a stale target fails here in
      # seconds instead of only when its 60-second smoke run comes up.
      - name: Build fuzz targets
        working-directory: fuzz
        shell: bash
        run: cargo +nightly fuzz build
      # The checked-in corpus is gitignored. Seed the artifact targets from the
      # committed codec snapshots so the binary and JSON paths are exercised.
      - name: Seed artifact corpora
        working-directory: fuzz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus/fuzz_got_manifest corpus/fuzz_module_descriptor corpus/fuzz_manifest
          cp seeds/fuzz_manifest/* corpus/fuzz_manifest/
          cp ../crates/stc-got/tests/snapshots/cold.stc-got.json \
            corpus/fuzz_got_manifest/
          python3 - <<'PY'
          from pathlib import Path
          for source, target in [
              ("../crates/stc-codegen/tests/snapshots/module.stc-got.hex",
               "corpus/fuzz_got_manifest/module-binary"),
              ("../crates/stc-codegen/tests/snapshots/module.stc-desc.hex",
               "corpus/fuzz_module_descriptor/module-descriptor"),
          ]:
              Path(target).write_bytes(bytes.fromhex(Path(source).read_text()))
          PY
          printf '%s\n' \
            '{"io":{"image":{"inputs_bytes":4,"outputs_bytes":4,"markers_bytes":2},"bindings":[]}}' \
            > corpus/fuzz_module_descriptor/metadata
          # Committed OOP fixtures exercise TYPEINFO/VTABLE/interface-map
          # decoding and validation, including the malformed variants.
          cp seeds/fuzz_got_manifest/* corpus/fuzz_got_manifest/
          cp seeds/fuzz_module_descriptor/* corpus/fuzz_module_descriptor/
      - name: Smoke each target for 60 seconds
        working-directory: fuzz
        shell: bash
        run: |
          set -euo pipefail
          for target in fuzz_targets/*.rs; do
            name="$(basename "$target" .rs)"
            echo "::group::fuzz $name"
            cargo +nightly fuzz run "$name" -- -max_total_time=60 -rss_limit_mb=2048 -timeout=25 -max_len=1048576
            echo "::endgroup::"
          done

  cross-target:
    name: Cross-target IR smoke (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.cross_target == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Assemble AArch64 object from the checked-in smoke module
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cross-target"
          clang --target=aarch64-unknown-linux-gnu -c tests/cross-target/smoke.ll \
            -o "$RUNNER_TEMP/cross-target/smoke-aarch64.o"
      - name: Run the cross-target matrix
        shell: bash
        run: cargo xtask test --suite cross-target --locked

  # The release package is built and verified on every native host. The job
  # also exercises the unpacked layout: `bin/stc` must find the runtime in
  # `lib/` and check, build, run, test, and clean a fresh project without
  # environment variables, then rebuild it after the clean.
  package:
    name: Release package (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: "-D warnings"
      STC_REQUIRE_CLANG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Print toolchain versions
        shell: bash
        run: |
          clang --version | head -n 1 || echo "clang unavailable"
          rustc --version || echo "rustc unavailable"
      - uses: Swatinem/rust-cache@v2
      - name: Build and verify the package
        shell: bash
        run: cargo xtask package --locked --out dist
      # The contract is host-derived (D-206). Assert the produced file, not
      # just the code path: the directory ends with the native triple and the
      # debug backend names this host's real object format.
      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          package="$(cd dist/stc-* && pwd)"
          name="$(basename "$package")"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$name" in
            *"-$host") ;;
            *)
              echo "::error::package directory $name does not end with the native host triple $host"
              exit 1
              ;;
          esac
          contract="$(sed -n 's/.*"debug_contract": "\([^"]*\)".*/\1/p' "$package/package.json")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            expected="object-codeview"
          else
            expected="dwarf"
          fi
          if [ "$contract" != "$expected" ]; then
            echo "::error::package.json debug_contract is '$contract', expected '$expected' on $RUNNER_OS"
            exit 1
          fi
          echo "package $name: host=$host debug_contract=$contract"
      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/stc-*
          sha256sum -c SHA256SUMS
      - name: Exercise the unpacked package
        shell: bash
        run: |
          set -euo pipefail
          package="$(cd dist/stc-* && pwd)"
          driver="$package/bin/stc"
          if [ "$RUNNER_OS" = "Windows" ]; then driver="$driver.exe"; fi
          "$driver" --version
          "$driver" compliance --message-format json > compliance.json
          "$driver" new fresh
          cd fresh
          "$driver" check
          "$driver" build
          "$driver" build --release
          "$driver" build --release --emit=lib --out-dir libcheck
          "$driver" run --cycles 2
          "$driver" test
          # D-184: clean removes the generated trees but keeps the lockfile and
          # the runtime store, so the project must build again afterwards.
          "$driver" clean
          for tree in target/stc/debug target/stc/release target/stc/test; do
            if [ -e "$tree" ]; then
              echo "::error::stc clean left generated tree $tree in place"
              exit 1
            fi
          done
          test -f stc.lock
          "$driver" build
      - uses: actions/upload-artifact@v7
        with:
          name: stc-package-${{ matrix.os }}
          path: |
            dist/stc-*
            compliance.json
          if-no-files-found: error
