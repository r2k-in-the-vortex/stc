[package]
name = "stc-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "stc_driver"
path = "src/lib.rs"

[[bin]]
name = "stc"
path = "src/main.rs"

[dependencies]
stc-codegen = { path = "../stc-codegen" }
stc-dap = { path = "../stc-dap" }
stc-diag = { path = "../stc-diag" }
stc-fmt = { path = "../stc-fmt" }
stc-got = { path = "../stc-got" }
stc-hir = { path = "../stc-hir" }
stc-lexer = { path = "../stc-lexer" }
stc-lsp = { path = "../stc-lsp" }
stc-manifest = { path = "../stc-manifest" }
stc-parser = { path = "../stc-parser" }
stc-runtime = { path = "../stc-runtime" }
stc-sema = { path = "../stc-sema" }
stc-span = { path = "../stc-span" }
stc-syntax = { path = "../stc-syntax" }
stc-test = { path = "../stc-test" }

[dev-dependencies]
serde_json = "1.0"
toml_edit = "0.25.17"

[lints]
workspace = true
