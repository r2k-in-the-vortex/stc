[package]
name = "stc-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The staticlib is the default embedding/host artifact; the cdylib is the
# shared host library requested by `[build] lib-type = "shared"`. The rlib lets
# the integration tests link the host API directly; it is not a product
# artifact.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
stc-got = { path = "../stc-got" }

# WL-15 Q3: the only external dependency the MQTT client adds. TLS uses
# user-supplied material only; no system or bundled trust store is enabled.
# `ring` avoids a CMake/NASM build requirement, and TLS 1.2 is kept for
# brokers that have not enabled 1.3.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
# WL-7 Q1: the ESI reader uses a vetted parser instead of a project-owned
# XML reader. Default features are off: the reader bounds the input itself and
# transcodes the accepted ISO-8859-1 documents, so no encoding feature is
# compiled in. DTDs, entity declarations, external resources and XInclude are
# rejected before parsing (WL-7-Plan.md §7).
quick-xml = { version = "0.42.0", default-features = false }

[dev-dependencies]
# The TLS tests stand up a loopback `rustls` broker; the client side uses the
# same approved stack through `stc-runtime`.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
stc-codegen = { path = "../stc-codegen" }
stc-diag = { path = "../stc-diag" }
stc-hir = { path = "../stc-hir" }
stc-lexer = { path = "../stc-lexer" }
stc-parser = { path = "../stc-parser" }
stc-sema = { path = "../stc-sema" }
stc-span = { path = "../stc-span" }

# The workspace forbids unsafe code. This crate is the documented exception:
# it is the C ABI boundary and owns all FFI pointer handling (D-077). Cargo
# cannot combine `workspace = true` with an override, so the lint is restated
# here; the workspace currently defines only `unsafe_code`.
[lints.rust]
unsafe_code = "allow"
