[package]
name = "stc-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
stc-got = { path = "../stc-got" }

[dev-dependencies]
stc-codegen = { path = "../stc-codegen" }
stc-diag = { path = "../stc-diag" }
stc-hir = { path = "../stc-hir" }
stc-lexer = { path = "../stc-lexer" }
stc-parser = { path = "../stc-parser" }
stc-sema = { path = "../stc-sema" }
stc-span = { path = "../stc-span" }

# The workspace forbids unsafe code. This crate is the documented exception:
# it is the C ABI boundary and owns all FFI pointer handling (D-077). Cargo
# cannot combine `workspace = true` with an override, so the lint is restated
# here; the workspace currently defines only `unsafe_code`.
[lints.rust]
unsafe_code = "allow"
