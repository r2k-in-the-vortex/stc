# Manual WL-15 two-host broker configuration (Q11).
#
# This file configures the third-party Mosquitto broker on the primary host for
# the manual evidence run only. It is not part of the build, the CI matrix, the
# test suite, or the release package, and the repository never ships a broker.
#
# Replace the paths with the operator's own user-supplied material. Never commit
# a private key, a password file, or a generated certificate authority.
#
# Run with: mosquitto -c tools/mqtt/mosquitto-tls.conf -v

per_listener_settings true

listener 8883
protocol mqtt
allow_anonymous false

# Server certificate and the CA that signs it. The `stc` MQTT device verifies
# this chain against the same CA file supplied in its profile.
cafile /etc/mosquitto/io/ca.pem
certfile /etc/mosquitto/io/server.pem
keyfile /etc/mosquitto/io/server.key

# Mutual TLS: set to true to require a client certificate. The peer host and
# `stc` then both need tls.client-cert-file / tls.client-key-file.
require_certificate false
use_identity_as_username false

# The runtime needs the password file and ACL below only when the profile uses
# credentials. Both are user files outside source control.
password_file /etc/mosquitto/io/passwords
acl_file /etc/mosquitto/io/acl

# Keep the log verbose enough to record the TLS version and cipher in the
# verification report.
log_dest stdout
log_type all
connection_messages true
