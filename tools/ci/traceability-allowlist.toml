# Traceability allowlist.
#
# `cargo xtask traceability --check` fails when an `STC-*` ID found in
# `specification/**/*.md` has no evidence in the tests or conformance corpus.
# Each entry below records why a rule is exempt. Keep the list small and
# update or remove entries when the rule is implemented or the spec changes.
#
# status = "not-implemented": a normative rule that the implementation does
# not provide yet. The associated reason names the milestone or decision.
# status = "example": an identifier in prose that is not a defined rule.

[[rule]]
id = "STC-E-ONLINE-STATE-001"
status = "not-implemented"
reason = "Per-field retained-state reset policy during online change is not implemented; v1 preserves host memory and rejects layout changes (State and RETAIN §7)."

[[rule]]
id = "STC-W-ONLINE-STATE-001"
status = "not-implemented"
reason = "Per-field retained-state reset policy during online change is not implemented; v1 preserves host memory and rejects layout changes (State and RETAIN §7)."

[[rule]]
id = "STC-W-ONLINE-004"
status = "not-implemented"
reason = "The stale-reference quarantine warning has a reserved code but no emission path; v1 quarantines removed roots silently (Online Change and GOT §8)."

[[rule]]
id = "STC-W-RUN-001"
status = "not-implemented"
reason = "Direct variables in function/FB bodies are rejected as STC-E-IO-001 rather than accepted with this deprecation warning (Runtime and Execution §2.4)."

[[rule]]
id = "STC-W-IO-ETH-001"
status = "not-implemented"
reason = "The locked DeviceBackend interface has no configuration-warning channel; unbound declared channels are configured and visible through backend status instead of emitting this warning."

[[rule]]
id = "STC-W-IO-ETH-002"
status = "not-implemented"
reason = "The locked DeviceBackend interface has no configuration-warning channel; a DC table without assign-activate runs free-run and is otherwise silent."

[[rule]]
id = "STC-W-IO-MODTCP-001"
status = "not-implemented"
reason = "The locked DeviceBackend interface has no configuration-warning channel; unbound declared Modbus channels are counted in server<N>.unbound diagnostics instead of emitting this warning (I/O Routing and Backends §4.5.7)."

[[rule]]
id = "STC-W-IO-MQTT-001"
status = "not-implemented"
reason = "The locked DeviceBackend interface has no configuration-warning channel; unbound declared MQTT channels are carried in the validated backend plan instead of emitting this warning (WL-15 phase 2)."

[[rule]]
id = "STC-W-IO-MQTT-002"
status = "not-implemented"
reason = "The locked DeviceBackend interface has no configuration-warning channel; MQTT client faults are reported through backend state, counters, and last_fault diagnostics instead of emitting this warning (I/O Routing and Backends §4.6.3)."

[[rule]]
id = "STC-W-REMOTE-001"
status = "not-implemented"
reason = "Remote source drift is reported by `stc remote status` JSON/human output and by the attach-time deployment decision; the DAP adapter has no separate warning event for it (WL-1.2)."

[[rule]]
id = "STC-W-REMOTE-002"
status = "not-implemented"
reason = "A successful remote deployment is reported by the control response and the refreshed session descriptor; the DAP adapter has no separate deployment warning event (WL-1.2)."

